[project]
name = "oilspill"
version = "0.1.0"
description = "SAR + AIS oil spill detection, drift hindcasting and vessel attribution"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- core / CLI ---
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # --- database ---
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # --- geospatial ---
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "geopandas>=1.0",
    "scikit-image>=0.24",
    # --- data ---
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "zstandard>=0.22",
    "xarray>=2024.6",
    "netCDF4>=1.7",
    # --- ml (classical) ---
    "scikit-learn>=1.5",
]

# Optional groups keep the base install light and let the heavy/fragile
# dependencies fail independently. See PLAN/PREREQUISITES.md.
[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
drift = [
    "opendrift>=1.11",
    "copernicusmarine>=1.3",
    "cdsapi>=0.7",
]
detect = [
    # NOTE: torch install is platform/CUDA specific -- see PLAN/PREREQUISITES.md.
    # Install torch FIRST from the correct index, then this group.
    "ultralytics>=8.2",
    "sahi>=0.11",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
oilspill = "backend.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "ml*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff formats Python code blocks inside Markdown. The research corpus and plan
# are prose deliverables whose snippets are illustrative, not executable --
# keep the formatter out of them.
extend-exclude = ["*.md", "RESEARCH", "PLAN", "paperSource", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live database",
    "gpu: requires a usable CUDA device",
    "network: requires network access",
    "fixture_data: requires downloaded fixture scenes",
]
